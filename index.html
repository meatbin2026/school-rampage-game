<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>校园暴走 - 放学别走</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
</head>
<body data-scene="home">
  <div id="appShell">
    <canvas id="gameCanvas"></canvas>

    <div class="screen-overlay" id="startScreen">
      <div class="shell-grid">
        <section class="shell-panel shell-left">
          <div class="shell-panel-inner">
            <div id="chromeHomePanel">
              <div id="chromeHomeContent"></div>
            </div>
            <div id="chromeLoadoutPanel" hidden>
              <div id="chromeLoadoutContent"></div>
            </div>
          </div>
        </section>

        <aside class="shell-right">
          <section class="shell-panel">
            <div class="shell-panel-inner">
              <div class="panel-label">战斗规则</div>
              <p class="panel-copy">主副武器自动攻击，随机掉落道具负责救场与爆发，Boss 负责拉高节奏峰值。战斗开始后，完整 HUD 会切换到战场层。</p>
            </div>
          </section>

          <section class="shell-panel">
            <div class="shell-panel-inner">
              <div class="panel-label">结算预览</div>
              <div id="chromeResultsContent"></div>
            </div>
          </section>
        </aside>
      </div>
    </div>

    <div class="hud" id="hud"></div>

    <div class="rage-indicator" id="rageIndicator">暴走模式!</div>
    <div class="active-effects" id="activeEffects"></div>
    <div class="hint" id="hint" style="display:none;">WASD/方向键移动 | 自动攻击 | 空格暴走 | Q切换主副武器 | P暂停</div>

    <div class="mobile-controls" id="mobileControls" style="display:none;">
      <div class="joystick-container" id="mobileJoystick">
        <div class="joystick-base" id="joystickBase">
          <div class="joystick-stick" id="joystickStick"></div>
        </div>
      </div>

      <div class="mobile-buttons" id="mobileButtons">
        <button class="mobile-btn rage-btn" id="rageBtn">
          <span class="btn-icon">😡</span>
          <span class="btn-text">暴走</span>
        </button>
        <button class="mobile-btn pause-btn" id="mobilePauseBtn">
          <span class="btn-icon">⏸️</span>
          <span class="btn-text">暂停</span>
        </button>
      </div>
    </div>

    <div class="modal" id="upgradeModal">
      <div class="modal-content shell-panel upgrade-modal-panel">
        <div class="shell-panel-inner">
          <div class="modal-kicker">LEVEL UP</div>
          <h2 class="modal-title">挑一张强化牌</h2>
          <p class="modal-subtitle">这一波站住了，马上补一张强化，把节奏继续往上抬。</p>
          <div class="upgrade-options" id="upgradeOptions"></div>
        </div>
      </div>
    </div>

    <div class="modal" id="gameOverModal">
      <div class="modal-content shell-panel results-modal-panel">
        <div class="shell-panel-inner">
          <div class="modal-kicker">RUN COMPLETE</div>
          <h2 class="modal-title">这局打完了</h2>
          <p class="modal-subtitle">先看战果，再决定要不要立刻再开一把。</p>
          <div class="game-over-stats">
            <div class="stat-box">
              <div class="stat-number" id="finalTime">00:00</div>
              <div class="stat-label">存活时间</div>
            </div>
            <div class="stat-box">
              <div class="stat-number" id="finalKills">0</div>
              <div class="stat-label">击败敌人</div>
            </div>
            <div class="stat-box">
              <div class="stat-number" id="finalLevel">1</div>
              <div class="stat-label">最高等级</div>
            </div>
          </div>

          <div class="save-info" id="gameOverStats" style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1);"></div>
          <div class="hero-actions">
            <button class="arcade-button ghost" id="restartBtn">返回大厅</button>
          </div>
        </div>
      </div>
    </div>

    <div class="version-display version-display" id="versionDisplay" onclick="VersionManager.showChangelog()">v1.7.3</div>

    <div class="orientation-hint" id="orientationHint">
      <div class="rotate-icon">📱</div>
      <h2>请横屏游玩</h2>
      <p>为了获得最佳体验，请将手机横置</p>
    </div>
  </div>

  <script src="js/version.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/tutorial.js"></script>
  <script type="module" src="src/app/bootstrap.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
