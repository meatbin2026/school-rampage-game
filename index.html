<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>校园暴走 - 放学别走</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff4757;
      --primary-dark: #c0392b;
      --secondary: #2ed573;
      --accent: #ffa502;
      --rage: #ff3838;
      --bg-dark: #1e272e;
      --bg-card: #2f3640;
      --text: #f5f6fa;
      --text-dim: #a4b0be;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
      touch-action: none;
    }

    /* 游戏画布 */
    #gameCanvas {
      display: block;
      background: linear-gradient(135deg, #2d3436 0%, #1e272e 100%);
    }

    /* HUD 界面 */
    .hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 15px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      min-width: 30px;
    }

    .bar-container {
      width: 120px;
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    .hp-fill {
      background: linear-gradient(90deg, #ff4757, #ff6b81);
    }

    .exp-fill {
      background: linear-gradient(90deg, #2ed573, #7bed9f);
    }

    .rage-fill {
      background: linear-gradient(90deg, #ff3838, #ff6348);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes wavePulse {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    @keyframes effectPulse {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    @keyframes bossWarning {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-50px); opacity: 0; }
    }

    .stat-value {
      font-size: 12px;
      font-weight: 600;
      min-width: 40px;
      text-align: right;
    }

    /* 暴走状态指示器 */
    .rage-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 72px;
      font-weight: 900;
      color: var(--rage);
      text-shadow: 0 0 30px var(--rage), 0 0 60px var(--rage);
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.3s;
    }

    .rage-indicator.active {
      opacity: 1;
      animation: rageShake 0.5s infinite;
    }

    @keyframes rageShake {
      0%, 100% { transform: translate(-50%, -50%) rotate(-5deg) scale(1); }
      50% { transform: translate(-50%, -50%) rotate(5deg) scale(1.1); }
    }

    /* HUD 右侧 */
    .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .pill {
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .level-pill {
      background: linear-gradient(135deg, #ffa502, #ff6348);
    }

    .btn {
      pointer-events: auto;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* 技能栏 */
    .skill-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .skill-slot {
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .skill-slot.active {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent);
    }

    .skill-slot.rage-skill {
      border-color: var(--rage);
      box-shadow: 0 0 20px var(--rage);
      animation: ragePulse 0.5s infinite;
    }

    @keyframes ragePulse {
      0%, 100% { box-shadow: 0 0 20px var(--rage); }
      50% { box-shadow: 0 0 40px var(--rage), 0 0 60px var(--rage); }
    }

    /* 升级弹窗 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      backdrop-filter: blur(5px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 2px solid var(--primary);
    }

    .modal-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .upgrade-options {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }

    .upgrade-card {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 15px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
    }

    .upgrade-card:hover {
      border-color: var(--accent);
      background: rgba(255, 165, 2, 0.2);
      transform: translateX(10px);
    }

    .upgrade-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .upgrade-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .upgrade-desc {
      font-size: 14px;
      color: var(--text-dim);
    }

    /* 游戏结束弹窗 */
    .game-over-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 20px 0;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 700;
      margin-top: 20px;
    }

    /* 提示文字 */
    .hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-dim);
      backdrop-filter: blur(10px);
      z-index: 50;
    }

    /* 开始界面 */
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #1e272e 0%, #2d3436 50%, #1e272e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 400;
    }

    .start-screen.hidden {
      display: none;
    }

    .game-title {
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff4757, #ffa502);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-shadow: 0 0 60px rgba(255, 71, 87, 0.5);
    }

    .game-subtitle {
      font-size: 24px;
      color: var(--text-dim);
      margin-bottom: 40px;
    }

    .character-select {
      display: flex;
      gap: 30px;
      margin-bottom: 40px;
    }

    .character-card {
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid transparent;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .character-card:hover,
    .character-card.selected {
      border-color: var(--primary);
      background: rgba(255, 71, 87, 0.2);
      transform: scale(1.05);
    }

    .character-avatar {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .character-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .character-desc {
      font-size: 14px;
      color: var(--text-dim);
    }

    .start-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 20px 60px;
      border-radius: 40px;
      font-size: 24px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 40px rgba(255, 71, 87, 0.4);
    }

    .start-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 50px rgba(255, 71, 87, 0.6);
    }

    /* 连击显示 */
    .combo-display {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 48px;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent);
      opacity: 0;
      pointer-events: none;
      z-index: 150;
      transition: opacity 0.3s;
    }

    .combo-display.active {
      opacity: 1;
      animation: comboPop 0.5s ease;
    }

    @keyframes comboPop {
      0% { transform: translateX(-50%) scale(0.5); }
      50% { transform: translateX(-50%) scale(1.2); }
      100% { transform: translateX(-50%) scale(1); }
    }
    
    /* 道具效果指示器动画 */
    @keyframes effectPulse {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    }
    
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-50px); opacity: 0; }
    }
    
    /* 激活效果指示器 */
    .active-effects {
      position: fixed;
      left: 20px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    
    .effect-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }
    
    .effect-badge.magnet { border-left: 3px solid #ffd93d; }
    .effect-badge.shield { border-left: 3px solid #74b9ff; }
    .effect-badge.speed { border-left: 3px solid #55efc4; }
    .effect-badge.exp { border-left: 3px solid #a29bfe; }
    
    @keyframes slideIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    /* 存档统计 */
    .save-stats {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      padding: 15px 25px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-item .stat-label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    
    .stat-item .stat-value {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    
    /* 成就列表 */
    .achievements-section {
      margin-top: 30px;
      width: 100%;
      max-width: 500px;
    }
    
    .achievements-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: var(--text);
      text-align: center;
    }
    
    .achievements-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }
    
    .achievement-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    
    .achievement-item.unlocked {
      background: rgba(46, 213, 115, 0.1);
      border-color: rgba(46, 213, 115, 0.3);
    }
    
    .achievement-item.locked {
      opacity: 0.5;
    }
    
    .achievement-emoji {
      font-size: 24px;
    }
    
    .achievement-info {
      flex: 1;
    }
    
    .achievement-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    
    .achievement-desc {
      font-size: 11px;
      color: var(--text-dim);
    }
    
    .achievement-check {
      color: var(--secondary);
      font-weight: bold;
    }
    
    /* 成就解锁通知 */
    .achievement-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      background: linear-gradient(135deg, rgba(46, 213, 115, 0.9), rgba(39, 174, 96, 0.9));
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(46, 213, 115, 0.4);
      z-index: 2000;
      animation: slideInRight 0.5s ease;
    }
    
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slideOut {
      to { transform: translateX(100%); opacity: 0; }
    }
    
    .achievement-unlock-icon {
      font-size: 40px;
    }
    
    .achievement-unlock-title {
      font-size: 12px;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .achievement-unlock-name {
      font-size: 18px;
      font-weight: 700;
    }
    
    .achievement-unlock-desc {
      font-size: 12px;
      opacity: 0.8;
    }
    
    /* Boss警告动画 */
    @keyframes bossWarning {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }
    
    /* 阶段切换动画 */
    @keyframes phaseChange {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
    
    /* 奖励飘浮动画 */
    @keyframes rewardFloat {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -120%) scale(0.9); opacity: 0; }
    }
    
    /* 胜利弹窗动画 */
    @keyframes victoryPopup {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    
    @keyframes fadeOut {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    }
    
    /* 武器升级动画 */
    @keyframes weaponLevelUp {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }
    
    /* 武器解锁动画 */
    @keyframes weaponUnlock {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0; }
    }
    
    /* 天赋解锁动画 */
    @keyframes talentUnlock {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }
    
    /* 排行榜排名弹窗动画 */
    @keyframes rankPopup {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }
    
    .save-info {
      font-size: 14px;
      color: var(--text-dim);
    }
    
    .save-info strong {
      color: var(--accent);
    }
    
    /* 版本显示 */
    .version-display {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 100;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
    }
    
    .version-display:hover {
      color: rgba(255, 255, 255, 0.8);
    }
    
    /* 更新日志弹窗 */
    .changelog-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5000;
      backdrop-filter: blur(5px);
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    
    .changelog-content {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 30px;
      max-width: 450px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid var(--accent);
      animation: slideUp 0.4s ease;
    }
    
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .changelog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .changelog-header h2 {
      font-size: 22px;
      color: var(--accent);
      margin: 0;
    }
    
    .changelog-date {
      font-size: 12px;
      color: var(--text-dim);
    }
    
    .changelog-body h3 {
      font-size: 16px;
      color: var(--text);
      margin-bottom: 15px;
    }
    
    /* 版本历史样式 */
    .version-section {
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border-left: 3px solid var(--text-dim);
    }
    
    .version-section.current {
      background: rgba(255, 165, 2, 0.1);
      border-left-color: var(--accent);
    }
    
    .version-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    
    .version-number {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .version-date {
      font-size: 12px;
      color: var(--text-dim);
    }
    
    .version-badge {
      font-size: 10px;
      padding: 2px 8px;
      background: var(--accent);
      color: var(--bg-dark);
      border-radius: 10px;
      font-weight: 700;
    }
    
    .version-title {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .changelog-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .changelog-list li {
      padding: 6px 0;
      font-size: 13px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    
    .changelog-list li:last-child {
      border-bottom: none;
    }
    
    .changelog-close {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .changelog-close:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
    }
    
    /* 新手引导样式 */
    .tutorial-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tutorial-highlight {
      border: 3px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 0 30px var(--accent), inset 0 0 30px rgba(255, 165, 2, 0.3);
      animation: highlightPulse 1.5s infinite;
      pointer-events: none;
      z-index: 10001;
    }
    
    @keyframes highlightPulse {
      0%, 100% { box-shadow: 0 0 30px var(--accent), inset 0 0 30px rgba(255, 165, 2, 0.3); }
      50% { box-shadow: 0 0 50px var(--accent), inset 0 0 50px rgba(255, 165, 2, 0.5); }
    }
    
    .tutorial-box {
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
      z-index: 10002;
      animation: slideUp 0.4s ease;
    }
    
    .tutorial-title {
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 15px;
    }
    
    .tutorial-content {
      font-size: 16px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    .tutorial-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s;
    }
    
    .progress-dot.active {
      background: var(--accent);
      transform: scale(1.2);
    }
    
    .tutorial-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .tutorial-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-prev {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    
    .btn-skip {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--text-dim);
    }
    
    .btn-next {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }
    
    .tutorial-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    .tutorial-complete {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10003;
      animation: fadeIn 0.3s ease;
    }
    
    .complete-content {
      background: var(--bg-card);
      border: 2px solid var(--secondary);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
    }
    
    .complete-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    
    .complete-content h3 {
      color: var(--secondary);
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    /* 设置按钮样式 */
    .settings-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .settings-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .settings-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--accent);
    }
    
    /* 移动端控制样式 */
    .mobile-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      pointer-events: none;
      z-index: 200;
    }
    
    .joystick-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    .joystick-base {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      position: relative;
      backdrop-filter: blur(5px);
    }
    
    .joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.05s;
    }
    
    .mobile-buttons {
      position: absolute;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      pointer-events: auto;
    }
    
    .mobile-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .mobile-btn:active, .mobile-btn.active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }
    
    .mobile-btn .btn-icon {
      font-size: 28px;
      margin-bottom: 2px;
    }
    
    .mobile-btn .btn-text {
      font-size: 10px;
      font-weight: 600;
    }
    
    .mobile-btn.rage-btn {
      background: rgba(255, 56, 56, 0.3);
      border-color: rgba(255, 56, 56, 0.5);
    }
    
    .mobile-btn.rage-btn:active, .mobile-btn.rage-btn.active {
      background: rgba(255, 56, 56, 0.6);
      box-shadow: 0 0 20px rgba(255, 56, 56, 0.6);
    }
    
    /* 移动端适配 */
    @media (max-width: 768px) {
      .game-title {
        font-size: 48px;
      }
      
      .game-subtitle {
        font-size: 18px;
      }
      
      .character-select {
        gap: 15px;
      }
      
      .character-card {
        padding: 20px;
      }
      
      .character-avatar {
        font-size: 48px;
      }
      
      .character-name {
        font-size: 16px;
      }
      
      .start-btn {
        padding: 15px 40px;
        font-size: 20px;
      }
      
      .hud {
        padding: 10px 15px;
      }
      
      .stat-bar {
        padding: 6px 12px;
      }
      
      .bar-container {
        width: 80px;
        height: 8px;
      }
      
      .pill {
        padding: 6px 12px;
        font-size: 12px;
      }
      
      .skill-bar {
        bottom: 180px;
      }
      
      .hint {
        display: none !important;
      }
    }
    
    /* 微信浏览器特殊处理 */
    body.wechat .game-title {
      font-size: 42px;
    }
    
    /* 横屏提示 */
    @media (max-width: 768px) and (orientation: portrait) {
      .orientation-hint {
        display: flex;
      }
    }
    
    .orientation-hint {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-dark);
      z-index: 10000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    
    .orientation-hint .rotate-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: rotatePhone 2s infinite;
    }
    
    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <!-- 开始界面 -->
  <div class="start-screen" id="startScreen">
    <h1 class="game-title">校园暴走</h1>
    <p class="game-subtitle">放学别走！</p>
    
    <!-- 存档统计 -->
    <div class="save-stats" id="saveStats">
      <div class="stat-item">
        <span class="stat-label">最高分</span>
        <span class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">总击杀</span>
        <span class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">游戏次数</span>
        <span class="stat-value">0</span>
      </div>
    </div>
    
    <div class="character-select">
      <div class="character-card selected" data-character="badboy">
        <div class="character-avatar">😎</div>
        <div class="character-name">校霸</div>
        <div class="character-desc">高攻击 高血量</div>
      </div>
      <div class="character-card" data-character="nerd">
        <div class="character-avatar">🤓</div>
        <div class="character-name">学霸</div>
        <div class="character-desc">高攻速 高移速</div>
      </div>
      <div class="character-card" data-character="sporty">
        <div class="character-avatar">🏃</div>
        <div class="character-name">体育生</div>
        <div class="character-desc">均衡型 暴走快</div>
      </div>
    </div>
    
    <button class="start-btn" id="startBtn">开始游戏</button>
    
    <!-- 设置按钮 -->
    <div class="settings-bar" style="margin: 10px 0;">
      <button class="settings-btn" id="muteBtn" onclick="AudioSystem.toggleMute()">
        🔊 音效: 开
      </button>
      <button class="settings-btn" onclick="TutorialSystem.reset(); TutorialSystem.start()">
        📖 查看教程
      </button>
    </div>
    
    <!-- 版本信息 -->
    <div class="version-info" style="margin: 15px 0; font-size: 14px; color: var(--text-dim); cursor: pointer;" onclick="VersionManager.showChangelog()">
      <span>当前版本: <strong class="version-display" style="color: var(--accent);">v1.4</strong></span>
      <span style="margin-left: 10px; font-size: 12px; opacity: 0.6;">点击查看更新日志</span>
    </div>
    
    <!-- 成就列表 -->
    <div class="achievements-section">
      <h3 class="achievements-title">🏆 成就</h3>
      <div class="achievements-list" id="achievementsList">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>

  <!-- 游戏画布 -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div class="hud" id="hud" style="display: none;">
    <div class="hud-left">
      <div class="stat-bar">
        <span class="stat-label">HP</span>
        <div class="bar-container">
          <div class="bar-fill hp-fill" id="hpBar" style="width: 100%"></div>
        </div>
        <span class="stat-value" id="hpText">100/100</span>
      </div>
      <div class="stat-bar">
        <span class="stat-label">EXP</span>
        <div class="bar-container">
          <div class="bar-fill exp-fill" id="expBar" style="width: 0%"></div>
        </div>
        <span class="stat-value" id="levelText">Lv.1</span>
      </div>
      <div class="stat-bar" id="rageBarContainer" style="opacity: 0;">
        <span class="stat-label" style="color: #ff3838;">怒</span>
        <div class="bar-container">
          <div class="bar-fill rage-fill" id="rageBar" style="width: 0%"></div>
        </div>
        <span class="stat-value" id="rageText">0%</span>
      </div>
    </div>
    
    <div class="hud-right">
      <div class="pill level-pill" id="levelPill">Lv.1</div>
      <div class="pill" id="wavePill" style="background: linear-gradient(135deg, #5f27cd, #341f97);">第1波</div>
      <div class="pill" id="timePill">00:00</div>
      <div class="pill" id="killPill">击败: 0</div>
      <button class="pill btn" id="pauseBtn">暂停</button>
    </div>
  </div>

  <!-- 暴走指示器 -->
  <div class="rage-indicator" id="rageIndicator">暴走模式!</div>

  <!-- 连击显示 -->
  <div class="combo-display" id="comboDisplay">x10 连击!</div>
  
  <!-- 激活效果指示器 -->
  <div class="active-effects" id="activeEffects"></div>

  <!-- 技能栏 -->
  <div class="skill-bar" id="skillBar" style="display: none;">
    <div class="skill-slot" id="skill1"></div>
    <div class="skill-slot" id="skill2"></div>
    <div class="skill-slot" id="skill3"></div>
    <div class="skill-slot" id="skill4"></div>
  </div>

  <!-- 提示 -->
  <div class="hint" id="hint" style="display: none;">
    WASD/方向键移动 | 自动攻击 | 空格键暴走 | P暂停
  </div>

  <!-- 移动端控制 -->
  <div class="mobile-controls" id="mobileControls" style="display: none;">
    <!-- 虚拟摇杆 -->
    <div class="joystick-container" id="mobileJoystick">
      <div class="joystick-base" id="joystickBase">
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
    </div>
    
    <!-- 技能按钮 -->
    <div class="mobile-buttons" id="mobileButtons">
      <button class="mobile-btn rage-btn" id="rageBtn">
        <span class="btn-icon">😡</span>
        <span class="btn-text">暴走</span>
      </button>
      <button class="mobile-btn pause-btn" id="mobilePauseBtn">
        <span class="btn-icon">⏸️</span>
        <span class="btn-text">暂停</span>
      </button>
    </div>
  </div>

  <!-- 升级弹窗 -->
  <div class="modal" id="upgradeModal">
    <div class="modal-content">
      <h2 class="modal-title">选择升级!</h2>
      <div class="upgrade-options" id="upgradeOptions"></div>
    </div>
  </div>

  <!-- 游戏结束弹窗 -->
  <div class="modal" id="gameOverModal">
    <div class="modal-content">
      <h2 class="modal-title">游戏结束</h2>
      <div class="game-over-stats">
        <div class="stat-box">
          <div class="stat-number" id="finalTime">00:00</div>
          <div class="stat-label">存活时间</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="finalKills">0</div>
          <div class="stat-label">击败敌人</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="finalLevel">1</div>
          <div class="stat-label">最高等级</div>
        </div>
      </div>
      
      <!-- 历史记录 -->
      <div class="save-info" id="gameOverStats" style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1);">
        <!-- 动态生成 -->
      </div>
      
      <button class="btn-primary" id="restartBtn">再来一局</button>
    </div>
  </div>

  <script src="js/version.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/game.js"></script>
  
  <!-- 版本显示 -->
  <div class="version-display" id="versionDisplay" onclick="VersionManager.showChangelog()">v1.4</div>
  
  <!-- 横屏提示 -->
  <div class="orientation-hint" id="orientationHint">
    <div class="rotate-icon">📱</div>
    <h2>请横屏游玩</h2>
    <p>为了获得最佳游戏体验，请将手机横置</p>
  </div>
</body>
</html>
